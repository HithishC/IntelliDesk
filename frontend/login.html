
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelliDesk | Login</title>
    <link rel="stylesheet" href="/src/styles/theme.css">
    <link rel="stylesheet" href="/src/styles/global.css">
    <link rel="stylesheet" href="/src/styles/glassmorphism.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080b1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 22px;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(124,58,237,0.12);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #a78bfa;
        }

        .subtitle {
            text-align: center;
            color: #a1a1aa;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            color: #d4d4d8;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.06);
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #8b5cf6;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg,#7c3aed,#06b6d4);
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #f87171;
        }

        .footer {
            text-align: center;
            color: #71717a;
            margin-top: 25px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo">IntelliDesk</div>

        <p class="subtitle">
            AI Incident Intelligence System
        </p>

        <form id="loginForm">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" id="loginButton">
                Sign In
            </button>

        </form>

        <p id="message"></p>

        <div class="footer">
            Powered by ZERITH | ANVESHAN 2026
        </div>
    </div>

    <script type="module" src="/src/pages/login.js"></script>

</body>
</html>
