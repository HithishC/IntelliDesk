
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelliDesk | Incident Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080b1a;
            color: white;
        }

        .sidebar {
            position: fixed;
            width: 240px;
            height: 100vh;
            padding: 30px 20px;
            background: #10152a;
            border-right: 1px solid #252b45;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            color: #a78bfa;
            margin-bottom: 45px;
        }

        .nav-item {
            display: block;
            padding: 15px;
            margin-bottom: 10px;
            color: #a1a1aa;
            text-decoration: none;
            border-radius: 10px;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #29204b;
            color: #c4b5fd;
        }

        .main {
            margin-left: 240px;
            padding: 35px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 35px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        .subtitle {
            color: #a1a1aa;
        }

        button {
            padding: 12px 20px;
            background: linear-gradient(90deg, #7c3aed, #06b6d4);
            color: white;
            border: none;
            border-radius: 9px;
            cursor: pointer;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            padding: 25px;
            border-radius: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card p {
            color: #a1a1aa;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            margin-top: 15px;
        }

        .critical {
            color: #f87171;
        }

        .incident-card {
            margin-bottom: 20px;
        }

        .incident-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .priority {
            padding: 7px 12px;
            border-radius: 7px;
            font-weight: bold;
            background: rgba(255,255,255,0.08);
        }

        .priority.Critical { color: #f87171; }
        .priority.High { color: #fb923c; }
        .priority.Medium { color: #fbbf24; }
        .priority.Low { color: #4ade80; }

        .incident-details {
            color: #a1a1aa;
            margin: 15px 0;
        }

        .ticket {
            background: rgba(255,255,255,0.04);
            border: 1px solid #292d42;
            border-radius: 10px;
            padding: 15px;
            margin-top: 12px;
        }

        .ticket-id {
            color: #a78bfa;
            font-weight: bold;
        }

        .ticket p {
            color: #d4d4d8;
            line-height: 1.5;
        }

        .message {
            color: #a1a1aa;
            margin-top: 20px;
        }

        .error {
            color: #f87171;
        }

        @media(max-width: 900px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }

        @media(max-width: 650px) {
    .sidebar {
        display: flex;
        position: relative;
        width: 100%;
        height: auto;
        padding: 15px;
        flex-direction: column;
        border-right: none;
        border-bottom: 1px solid #252b45;
    }

    .logo {
        margin-bottom: 15px;
    }

    .nav-item {
        padding: 12px;
        margin-bottom: 5px;
    }

    .main {
        margin-left: 0;
        padding: 20px;
    }

    .header {
        align-items: flex-start;
        flex-direction: column;
    }
}
    </style>
</head>

<body>

    <aside class="sidebar">
    <div class="logo">IntelliDesk</div>

    <a href="/dashboard.html" class="nav-item">Dashboard</a>
    <a href="/raise-complaint.html" class="nav-item">＋ Raise Complaint</a>
    <a href="/tickets.html" class="nav-item">Tickets</a>
    <a href="/incidents.html" class="nav-item active">Incidents</a>
    <a href="/feedback.html" class="nav-item">Feedback</a>
    <a href="/analytics.html" class="nav-item">Analytics</a>
</aside>

    <main class="main">

        <header class="header">
            <div>
                <h1>Incident Management</h1>
                <p class="subtitle">
                    Monitor related complaints and detect potential incidents.
                </p>
            </div>

            <button id="refreshButton">↻ Refresh Incidents</button>
        </header>

        <section class="stats">

            <div class="card">
                <p>Total Incidents</p>
                <div class="number" id="totalIncidents">--</div>
            </div>

            <div class="card">
                <p>Affected Tickets</p>
                <div class="number" id="affectedTickets">--</div>
            </div>

            <div class="card">
                <p>Critical Incidents</p>
                <div class="number critical" id="criticalIncidents">--</div>
            </div>

        </section>

        <section class="card">
            <h2>Detected Incident Groups</h2>

            <p id="incidentCount" class="subtitle">
                Loading incidents...
            </p>

            <p id="errorMessage" class="error"></p>

            <div id="incidentContainer">
                Loading incident data...
            </div>
        </section>

    </main>

    <script type="module" src="/src/pages/incidents.js"></script>

</body>
</html>
